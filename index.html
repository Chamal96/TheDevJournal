<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("tdj-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <title>Home</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="./index.html">
          <strong data-blog-title>The Dev Journal</strong>
          <span data-blog-tagline></span>
        </a>
        <nav class="nav" aria-label="Site">
          <a href="./index.html" data-nav="home">Writing</a>
          <a href="./about.html" data-nav="about">About</a>
          <a href="./stats.html" data-nav="stats">Stats</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="home-shell">
        <aside class="topic-filter" aria-label="Topics">
          <p class="filter-heading">Topics</p>
          <div class="filter-list" id="topic-filters"></div>
        </aside>
        <ol class="post-grid" id="post-list"></ol>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap" data-blog-footer></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="./config.js"></script>
    <script src="./js/blog.js"></script>
    <script src="./js/publish.js"></script>
    <script>
      Blog.applySiteChrome("home");

      const list = document.getElementById("post-list");
      const filters = document.getElementById("topic-filters");
      let allPosts = [];
      let activeTopic = "all";

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderFilters() {
        const topics = Blog.topicList();
        filters.innerHTML = ["All", ...topics]
          .map((topic) => {
            const value = topic === "All" ? "all" : topic;
            const pressed = activeTopic.toLowerCase() === value.toLowerCase();
            return `<button type="button" class="filter-btn" data-topic="${escapeHtml(value)}" aria-pressed="${pressed}">${escapeHtml(topic)}</button>`;
          })
          .join("");
      }

      function renderPosts(posts) {
        if (!posts.length) {
          list.innerHTML =
            "<li class='muted empty-filter'>No posts in this topic yet.</li>";
          return;
        }

        list.innerHTML = posts
          .map((post) => {
            const tags = Blog.postTags(post)
              .map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`)
              .join("");
            return `
              <li>
                <a class="post-card" href="./post.html?slug=${encodeURIComponent(post.slug)}">
                  ${Blog.coverMarkup(post, "post-card-cover")}
                  <div class="post-card-body">
                    <p class="post-meta">${Blog.formatDate(post.date)}</p>
                    <h2>${escapeHtml(post.title)}</h2>
                    <p class="post-card-summary">${escapeHtml(post.summary || "")}</p>
                    <div class="tag-row">${tags}</div>
                    <p class="post-engagement" data-engagement="${post.slug}">Loading reactions…</p>
                  </div>
                </a>
              </li>
            `;
          })
          .join("");
      }

      function showTopic(topic) {
        activeTopic = topic;
        renderFilters();
        renderPosts(allPosts.filter((post) => Blog.postMatchesTopic(post, topic)));
        const engagement = window.__postEngagement;
        if (!engagement) return;
        list.querySelectorAll("[data-engagement]").forEach((el) => {
          el.textContent = Blog.formatEngagementLine(engagement[el.dataset.engagement]);
        });
      }

      filters.addEventListener("click", (event) => {
        const button = event.target.closest("[data-topic]");
        if (!button) return;
        showTopic(button.getAttribute("data-topic"));
      });

      Blog.loadPostIndex()
        .then((posts) => {
          allPosts = posts;
          renderFilters();
          renderPosts(posts);
          if (!posts.length) return;

          return Blog.loadEngagementMap(posts.map((post) => post.slug)).then((engagement) => {
            window.__postEngagement = engagement;
            list.querySelectorAll("[data-engagement]").forEach((el) => {
              el.textContent = Blog.formatEngagementLine(engagement[el.dataset.engagement]);
            });
          });
        })
        .catch((error) => {
          list.innerHTML = `<li class="error">${error.message} Open this site through a local server or GitHub Pages, not as a raw file.</li>`;
        });
    </script>
  </body>
</html>
