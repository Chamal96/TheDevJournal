<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("tdj-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <title>Not found</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="./index.html">
          <strong data-blog-title>The Dev Journal</strong>
          <span data-blog-tagline></span>
        </a>
      </div>
    </header>
    <main>
      <div class="wrap">
        <section class="page-card">
          <h1 class="page-title">Page not found</h1>
          <p><a href="./index.html">Back to the writing</a></p>
        </section>
      </div>
    </main>
    <footer class="site-footer">
      <div class="wrap" data-blog-footer></div>
    </footer>
    <script src="./config.js"></script>
    <script src="./js/blog.js"></script>
    <script>
      Blog.applySiteChrome("404");
    </script>
  </body>
</html>
