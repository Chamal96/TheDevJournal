<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("tdj-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <title>Post</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="./index.html">
          <strong data-blog-title>The Dev Journal</strong>
          <span data-blog-tagline></span>
        </a>
        <nav class="nav" aria-label="Site">
          <a href="./index.html" data-nav="home">Writing</a>
          <a href="./about.html" data-nav="about">About</a>
          <a href="./stats.html" data-nav="stats">Stats</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="wrap" id="post-root"></div>
    </main>

    <footer class="site-footer">
      <div class="wrap" data-blog-footer></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="./config.js"></script>
    <script src="./js/blog.js"></script>
    <script>
      const root = document.getElementById("post-root");
      const slug = new URLSearchParams(window.location.search).get("slug");

      async function showPost() {
        if (!slug) {
          throw new Error("Missing post.");
        }

        const posts = await Blog.loadPostIndex();
        const post = posts.find((item) => item.slug === slug);
        if (!post) {
          throw new Error("That post is not public.");
        }

        const response = await fetch(`./posts/${encodeURIComponent(post.slug)}.md`, {
          cache: "no-store",
        });
        if (!response.ok) {
          throw new Error("The post file could not be loaded.");
        }

        const markdown = await response.text();
        document.title = post.title;
        Blog.applySiteChrome("post");

        root.innerHTML = `
          <article class="post">
            ${Blog.coverMarkup(post, "post-hero-cover")}
            <div class="post-inner">
              <p class="post-meta" data-post-meta>${Blog.formatDate(post.date)}</p>
              <h1 class="post-title">${post.title}</h1>
              <div class="post-body">${Blog.renderMarkdown(markdown)}</div>
              ${Blog.reactionBarMarkup()}
            </div>
          </article>
        `;

        const coverSrc = Blog.coverUrl(post.cover);
        if (coverSrc) {
          const imageMeta = document.createElement("meta");
          imageMeta.setAttribute("property", "og:image");
          imageMeta.content = new URL(coverSrc, window.location.href).href;
          document.head.appendChild(imageMeta);
        }

        const views = await Blog.recordView(post.slug);
        const meta = root.querySelector("[data-post-meta]");
        if (meta) {
          meta.textContent = `${Blog.formatDate(post.date)} · ${views} ${views === 1 ? "view" : "views"}`;
        }
        await Blog.mountReactions(root.querySelector(".reaction-bar"), post.slug);
      }

      showPost().catch((error) => {
        Blog.applySiteChrome("post");
        root.innerHTML = `<div class="error">${error.message}</div>`;
      });
    </script>
  </body>
</html>
